services:
  - type: web
    name: acolhe-api
    runtime: python
    rootDir: acolhe-backend
    region: virginia
    plan: free
    buildCommand: pip install .
    startCommand: bash ./scripts/render-start.sh
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_NAME
        value: Acolhe API
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: acolhe-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_DEMO_DATA
        value: false
      - key: RATE_LIMIT_PER_MINUTE
        value: 45
      - key: PRIMARY_USER_NAME
        value: Usuaria Acolhe
      - key: PRIMARY_USER_PIN
        sync: false
      - key: LLM_ENABLED
        value: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4.1-mini
      - key: LLM_TIMEOUT_SECONDS
        value: 20

databases:
  - name: acolhe-db
    region: virginia
    plan: free
